<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <title>%PROFILE_PAGE_TITLE%</title>
    <meta name="description" content="%PROFILE_META_DESCRIPTION%">
    <link rel="canonical" href="%PROFILE_CANONICAL_URL%">
    <meta property="og:title" content="%PROFILE_OG_TITLE%">
    <meta property="og:description" content="%PROFILE_OG_DESCRIPTION%">
    <meta property="og:type" content="website">
    <meta property="og:url" content="%PROFILE_OG_URL%">
    <meta property="og:site_name" content="%PROFILE_OG_SITE_NAME%">
    <meta property="og:image" content="%PROFILE_OG_IMAGE_URL%">
    <meta property="og:image:alt" content="%PROFILE_OG_IMAGE_ALT%">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="%PROFILE_TWITTER_TITLE%">
    <meta name="twitter:description" content="%PROFILE_TWITTER_DESCRIPTION%">
    <meta name="twitter:image" content="%PROFILE_TWITTER_IMAGE_URL%">
    <meta name="twitter:image:alt" content="%PROFILE_TWITTER_IMAGE_ALT%">
    <meta name="theme-color" content="#1f345b">
    <link rel="icon" href="favicon.ico?v=2" type="image/x-icon">
    <script src="https://widgets.sociablekit.com/linkedin-recommendations/widget.js" defer></script>
</head>
<body>
    <div id="root"></div>
    <!-- 100% privacy-first analytics -->
    <script data-collect-dnt="true" async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif?collect-dnt=true" alt="" referrerpolicy="no-referrer-when-downgrade"></noscript>
</body>
</html>
